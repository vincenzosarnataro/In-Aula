# Progetto Xcode generato con XcodeGen: `brew install xcodegen && cd iosApp && xcodegen`
name: Aula
options:
  bundleIdPrefix: it.aula
  deploymentTarget:
    iOS: "17.0"
targets:
  Aula:
    type: application
    platform: iOS
    sources: [Aula]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.aula.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "In Aula"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        # Il framework statico prodotto da Gradle per la configurazione/SDK correnti.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compila il modulo shared (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
